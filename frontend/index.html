<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central Library Management & Circulation System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sidebar Navigation -->
  <aside class="side">
    <div class="brand">
      <div class="brand-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          <line x1="12" y1="6" x2="16" y2="6"/>
          <line x1="12" y1="10" x2="16" y2="10"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Central Library</h1>
        <p class="sub">Circulation &amp; DBMS Portal</p>
      </div>
    </div>

    <nav id="nav">
      <button data-p="dashboard" class="on" title="Live Library Analytics & Quick View">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span>Dashboard</span>
      </button>

      <button data-p="books" title="Browse and Manage Book Catalog">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>Books Catalog</span>
      </button>

      <button data-p="members" title="Manage Students & Faculty Accounts">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Members</span>
      </button>

      <button data-p="circulation" title="Process Book Issues and Returns">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        <span>Issue &amp; Return</span>
      </button>

      <button data-p="reports" title="Database Views & Analytic Reports">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><path d="M3 20h18"/></svg>
        <span>Reports &amp; Views</span>
      </button>

      <button data-p="masters" title="Authors, Categories, Publishers & Departments">
        <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Authors &amp; Lookups</span>
      </button>
    </nav>

    <!-- Sidebar footer badge -->
    <div class="side-footer">
      <div class="db-badge">
        <span class="db-indicator"></span>
        <div class="db-info">
          <span class="db-title">MySQL 3NF Database</span>
          <span class="db-sub">Port 3306 &bull; Connected</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <main>
    <!-- Top Header Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="greeting-box">
          <span class="greeting-tag">Circulation Management</span>
          <span class="greeting-univ">College of Engineering &bull; Central Academic Library</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="system-time-chip" id="clockChip">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="liveTime">System Live</span>
        </div>
        <div class="user-chip">
          <div class="avatar-circle">CL</div>
          <div class="user-meta">
            <span class="user-name">Chief Librarian</span>
            <span class="user-role">Administrator</span>
          </div>
        </div>
      </div>
    </header>

    <div id="toast" role="status" aria-live="polite"></div>
    <section id="view"></section>
  </main>

  <!-- Modal Dialog -->
  <dialog id="dlg">
    <div class="dlg-wrapper">
      <form method="dialog" id="frm"></form>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    // Live Clock display
    function updateClock() {
      const el = document.getElementById('liveTime');
      if (el) {
        const d = new Date();
        el.textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
    }
    updateClock();
    setInterval(updateClock, 30000);
  </script>
</body>
</html>
